name: trac-portal
services:
  api:
    container_name: trac-portal-api
    image: ghcr.io/trac-erzurum/trac-portal-api:${API_TAG}
    restart: unless-stopped

    environment:
      # General
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-8000}

      # Database
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSL: ${DB_SSL:-false}

      # Secrets & Auth
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      SESSION_SECRET: ${SESSION_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}

      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}

      # Cloudflare R2 Storage
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}

      # Integrations
      GITHUB_REPO_WEB_URL: ${GITHUB_REPO_WEB_URL}
      GITHUB_FEEDBACK_TOKEN: ${GITHUB_FEEDBACK_TOKEN}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}

    volumes:
      - /opt/stacks/trac-portal/volumes/uploads:/app/uploads
      - /opt/stacks/trac-portal/volumes/backups:/app/backup

    networks:
      - internal
      - data

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

    deploy:
      resources:
        limits:
          memory: 768M

  ui:
    container_name: trac-portal-ui
    image: ghcr.io/trac-erzurum/trac-portal-ui:${UI_TAG}
    restart: unless-stopped

    environment:
      DOMAIN: ${DOMAIN}

    depends_on:
      api:
        condition: service_healthy

    networks:
      - internal
      - edge

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    deploy:
      resources:
        limits:
          memory: 512M

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=edge"
      - "traefik.http.routers.trac.rule=Host(`${DOMAIN}`) || Host(`${TEST_DOMAIN}`)"
      - "traefik.http.routers.trac.entrypoints=websecure"
      - "traefik.http.services.trac.loadbalancer.server.port=80"

networks:
  internal:
  edge:
    external: true
  data:
    external: true
